name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # botón para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#06b6d4&color_dots=#161b22,#0e4f5c,#0891b2,#06b6d4,#67e8f9

      - name: Slow down the snake (1.5x)
        run: |
          sudo python3 - <<'PY'
          import re, glob
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              s = re.sub(r"(\d+(?:\.\d+)?)ms", lambda m: f"{round(float(m.group(1)) * 1.5)}ms", s)
              open(f, "w").write(s)
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
